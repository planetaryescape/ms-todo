# Adapted from spotuify .github/workflows/release-please.yml and release.yml
# @ d807e5e4f9d2f09878cdc22309af3589623f7785 (action pins, build matrix,
# packaging and checksums).
#
# One workflow on purpose. The repo has no secrets, so release-please runs
# with GITHUB_TOKEN, and GitHub doesn't start other workflows from events
# GITHUB_TOKEN creates: a separate tag-triggered release.yml would never run.
# The build jobs therefore live here, gated on release-please's output.
#
# release-please creates the release as a draft (with its tag, via
# force-tag-creation), and `publish` makes it public only once every build
# has uploaded. If a build fails, the release stays a draft, so install.sh's
# "latest" lookup never finds a release with missing assets.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    env:
      # The maintainer's Entra client ID, baked into release builds through
      # option_env! (D-025). It's public, not a secret.
      MS_TODO_CLIENT_ID: 48d9179b-67f3-4969-985e-9690aff42435
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin ms-todo

      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/ms-todo"
          test "$("$BIN" --version)" = "ms-todo ${TAG#v}"
          grep -aq "$MS_TODO_CLIENT_ID" "$BIN" || {
            echo "::error ::the release binary does not bundle the client ID"
            exit 1
          }

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          ARCHIVE="ms-todo-${TAG}-${PLATFORM}.tar.gz"
          mkdir -p package
          cp "target/${TARGET}/release/ms-todo" README.md LICENSE-MIT LICENSE-APACHE package/
          tar czf "$ARCHIVE" -C package .
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
