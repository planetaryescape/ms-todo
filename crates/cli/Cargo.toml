[package]
name = "ms-todo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ms-todo's command line: clap definitions, the daemon client, output formats and exit codes."

[dependencies]
ms-todo-core = { workspace = true }
ms-todo-protocol = { workspace = true }
ms-todo-tui = { workspace = true }
# Only `ms_todo_graph::auth`, for `auth login|status|logout` (tests/workspace_boundaries.rs).
ms-todo-graph = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
fs2 = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
