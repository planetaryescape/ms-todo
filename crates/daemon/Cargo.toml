[package]
name = "ms-todo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ms-todo's daemon: the socket server, the sync loop, and the only process that talks to Graph, refreshes the token and touches the store."

[dependencies]
ms-todo-core = { workspace = true }
ms-todo-protocol = { workspace = true }
ms-todo-graph = { workspace = true }
ms-todo-store = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
futures-util = { workspace = true }
iana-time-zone = { workspace = true }
# TypeSafe, for list suggestions (rung 6b).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
socket2 = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Paused time, for the sync cadence.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
