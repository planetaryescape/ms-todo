[package]
name = "ms-todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A local-first, keyboard-native terminal client for Microsoft To Do."
readme = "README.md"
# Distributed as prebuilt binaries from GitHub Releases, not crates.io. The
# internal crates are organisational seams, not library APIs.
publish = false

[[bin]]
name = "ms-todo"
path = "src/main.rs"

[features]
# `tests/live_smoke.rs`: the whole surface against a real account, run by
# hand (`cargo test --features live-smoke --test live_smoke -- --ignored`).
live-smoke = []

[dependencies]
ms-todo-cli = { workspace = true }
ms-todo-daemon = { workspace = true }

[dev-dependencies]
ms-todo-protocol = { workspace = true }
# The Graph double, shared with the demo harness.
ms-todo-fake-graph = { workspace = true }
assert_cmd = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
insta = { workspace = true }
# The daemon's session and parent, to check auto-start detaches it.
nix = { workspace = true }
serde_json = { workspace = true }
# Attachments' bytes compared by hash.
sha2 = { workspace = true }
# Tests reach into a daemon's database to make its writes fail.
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tokio-util = { workspace = true }
toml = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    ".",
    "crates/core",
    "crates/nlp",
    "crates/protocol",
    "crates/graph",
    "crates/store",
    "crates/daemon",
    "crates/cli",
    "crates/tui",
    "crates/fake-graph",
    "demo/fake-graph",
]

[workspace.package]
version = "0.1.29"
edition = "2024"
# sqlx 0.9 needs 1.94.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/planetaryescape/ms-todo"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
ms-todo-core = { path = "crates/core" }
ms-todo-nlp = { path = "crates/nlp" }
ms-todo-protocol = { path = "crates/protocol" }
ms-todo-graph = { path = "crates/graph" }
ms-todo-store = { path = "crates/store" }
ms-todo-daemon = { path = "crates/daemon" }
ms-todo-cli = { path = "crates/cli" }
ms-todo-tui = { path = "crates/tui" }
ms-todo-fake-graph = { path = "crates/fake-graph" }

# The nearest 256-colour index for an RGB theme colour, where truecolor is
# missing.
ansi_colours = { version = "1", default-features = false }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1"
dirs = "6"
fastrand = "2"
fs2 = "0.4"
html2text = "0.17"
iana-time-zone = "0.1"
linkify = "0.11"
# An attachment's content type, from its file name.
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# An attachment ID in an upload session's `Location`.
percent-encoding = "2"
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }
ratatui = "0.30"
# Safe-API openat/linkat/renameat, for writing downloads relative to one
# directory handle (D-056).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
regex = "1"
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", features = ["json", "form"] }  # rustls is the default TLS in 0.13
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Splits `[suggest] api_key_command` into argv the way a shell would,
# without running one.
shlex = "2"
socket2 = "0.6"
# Runtime queries only: no `query!` macros, so builds need no database.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
# Writes the TUI's theme into config.toml, keeping its comments.
toml_edit = "0.25"
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Terminal cells a glyph takes, to lay out the TUI's marker columns.
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

assert_cmd = "2"
insta = "1"
proptest = "1"
tempfile = "3"
wiremock = "0.6"
