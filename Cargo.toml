[package]
name = "ms-todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A local-first, keyboard-native terminal client for Microsoft To Do."
readme = "README.md"
# Distributed as prebuilt binaries from GitHub Releases, not crates.io. The
# internal crates are organisational seams, not library APIs.
publish = false

[[bin]]
name = "ms-todo"
path = "src/main.rs"

[dependencies]
ms-todo-cli = { workspace = true }
ms-todo-daemon = { workspace = true }

[dev-dependencies]
ms-todo-protocol = { workspace = true }
assert_cmd = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
# Tests reach into a daemon's database to make its writes fail.
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    ".",
    "crates/core",
    "crates/protocol",
    "crates/graph",
    "crates/store",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
# sqlx 0.9 needs 1.94.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/planetaryescape/ms-todo"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
ms-todo-core = { path = "crates/core" }
ms-todo-protocol = { path = "crates/protocol" }
ms-todo-graph = { path = "crates/graph" }
ms-todo-store = { path = "crates/store" }
ms-todo-daemon = { path = "crates/daemon" }
ms-todo-cli = { path = "crates/cli" }

bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
fastrand = "2"
fs2 = "0.4"
iana-time-zone = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
reqwest = { version = "0.13", features = ["json", "form"] }  # rustls is the default TLS in 0.13
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Runtime queries only: no `query!` macros, so builds need no database.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }

assert_cmd = "2"
insta = "1"
tempfile = "3"
wiremock = "0.6"
