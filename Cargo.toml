[package]
name = "ms-todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A local-first, keyboard-native terminal client for Microsoft To Do."
readme = "README.md"
# Distributed as prebuilt binaries from GitHub Releases, not crates.io. The
# internal crates are organisational seams, not library APIs.
publish = false

[[bin]]
name = "ms-todo"
path = "src/main.rs"

[dependencies]
ms-todo-cli = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "crates/core", "crates/graph", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/planetaryescape/ms-todo"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
ms-todo-core = { path = "crates/core" }
ms-todo-graph = { path = "crates/graph" }
ms-todo-cli = { path = "crates/cli" }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
reqwest = { version = "0.13", features = ["json", "form"] }  # rustls is the default TLS in 0.13
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
toml = "1"

assert_cmd = "2"
insta = "1"
tempfile = "3"
wiremock = "0.6"
